name: Release

# Pushing a tag such as v0.2.0 publishes a GitHub release with the matching CHANGELOG section.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package the build
        run: cd dist && zip -r "../horizon-shift-${GITHUB_REF_NAME}.zip" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "horizon-shift-${GITHUB_REF_NAME}.zip" \
            --title "Horizon Shift ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
